; ESP32 robot: Bluetooth teleop + micro-ROS autonomous mode (differential drive)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Single large app partition (no OTA) instead of the default two-OTA-slot
; scheme -- ~3MB for app code instead of ~1.31MB. Same bootloader/partition
; -table/otadata offsets, so deploy.sh's flash offsets stay valid.
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    h2zero/NimBLE-Arduino
board_microros_transport = serial
board_microros_distro = jazzy
