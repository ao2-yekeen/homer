; ESP32 robot: micro-ROS controlled from the Pi (differential drive)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Single large app partition (no OTA) instead of the default two-OTA-slot
; scheme -- ~3MB for app code instead of ~1.31MB. Same bootloader/partition
; -table/otadata offsets, so deploy.sh's flash offsets stay valid.
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
board_microros_transport = serial
board_microros_distro = jazzy
; The diagnostic programs are standalone Arduino sketches with their own
; setup()/loop(); never link them into the production robot firmware.
build_src_filter = +<main.cpp> -<servo_sweep.cpp> -<servo_idle.cpp>

; Temporary neck-servo diagnostic. It compiles only servo_sweep.cpp and does
; not initialise micro-ROS or any drive-motor pins.
[env:servo_sweep]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<servo_sweep.cpp> -<main.cpp>

; Safe idle image for immediately stopping the neck-servo test.
[env:servo_idle]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<servo_idle.cpp> -<main.cpp>
