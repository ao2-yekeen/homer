camera: /dev/v4l/by-id/usb-Generic_USB_Camera_200901010001-video-index0
width: 640
height: 480
# Required fixed Logitech C930e overview view.
overview_camera:
  device: /dev/v4l/by-id/usb-046d_Logitech_Webcam_C930e-video-index0
  width: 640
  height: 480
fps: 10
joystick:
  device: /dev/input/by-id/usb-_USB_Controller_5F8629A3-event-joystick
serial: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B91029201-if00
baud: 1000000
sdk_path: /home/robot-b
joint_names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
servo_ids: [1, 2, 3, 4, 5, 6]
# Raw feedback uses 0..4095 ticks. Powered return also checks each servo's
# EEPROM travel limits. Assisted collection reads those limits from the servos.
