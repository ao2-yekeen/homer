# Copy to ~/.config/systemd/user/esp32-serial-bridge.service.d/approach.conf
# Use only after building the packages; this disables ordinary /cmd_vel input.
[Service]
ExecStart=
ExecStart=/bin/bash -lc 'source /opt/ros/jazzy/setup.bash && exec /usr/bin/python3 %h/mobile-robot/pi/esp32_serial_bridge.py --ros-args -p approach_mode:=true'
