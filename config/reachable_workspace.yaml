# HOM-8 workspace-characterisation record.
#
# Values in this file must come from the physical robot.  The URDF values are
# listed only as a setup aid and are not a calibrated workspace model.
schema_version: 1
frame:
  frame_id: base_footprint
  definition: >-
    Origin on the floor projection of the robot base reference point. +x is
    forward, +y is robot left, and +z is upward. Record all positions in
    metres in this frame.
  physical_alignment: REQUIRES_HARDWARE_TEST
  nominal_arm_mount_xyz_m: [0.0, 0.0, 0.4]
  nominal_arm_mount_source: >-
    simulation/urdf/home_mobile_manipulator_v6_real_base_layout.urdf;
    approximate only, not a physical measurement.

platform:
  height_m: null  # Measure from the same floor datum.
  usable_grasping_zone:
    x_min_m: null
    x_max_m: null
    y_min_m: null
    y_max_m: null
  status: REQUIRES_HARDWARE_TEST

# Add observations with `pi/soarm_workspace_record.py`. Do not infer a
# reachable volume from joint limits or the nominal URDF alone.
samples: []
